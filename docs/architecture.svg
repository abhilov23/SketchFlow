<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#211f2b"/>
      <stop offset="100%" stop-color="#3a3648"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8697"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#211f2b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1440" height="1000" fill="#f7f6fa"/>

  <text x="60" y="62" font-size="27" font-weight="700" fill="#211f2b">SketchFlow — System Design</text>
  <text x="60" y="88" font-size="14" fill="#777481">Real-time collaborative whiteboard · Next.js 15 · Express 4 · ws · PostgreSQL</text>

  <!-- ===================== CLIENT ===================== -->
  <rect x="60" y="130" width="270" height="330" rx="20" fill="url(#violet)" filter="url(#shadow)"/>
  <text x="195" y="172" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Browser</text>
  <text x="195" y="196" font-size="12.5" fill="#ddd6fe" text-anchor="middle">Next.js 15 · React 19</text>
  <line x1="90" y1="214" x2="300" y2="214" stroke="#ffffff" stroke-opacity="0.28"/>
  <text x="92" y="240" font-size="12.5" fill="#ede9fe">/signin · /signup</text>
  <text x="92" y="266" font-size="12.5" fill="#ede9fe">/dashboard</text>
  <text x="92" y="292" font-size="12.5" fill="#ede9fe">/canvas/:roomId</text>
  <line x1="90" y1="312" x2="300" y2="312" stroke="#ffffff" stroke-opacity="0.28"/>
  <text x="92" y="336" font-size="12.5" fill="#c4b5fd">AuthPage</text>
  <text x="92" y="360" font-size="12.5" fill="#c4b5fd">ConfirmDialog</text>
  <text x="92" y="384" font-size="12.5" fill="#c4b5fd">RoomCanvas</text>
  <text x="92" y="408" font-size="12.5" fill="#c4b5fd">Canvas 2D engine</text>
  <text x="92" y="438" font-size="11.5" fill="#a78bfa">JWT kept in localStorage</text>

  <!-- ===================== NODE PROCESSES ===================== -->
  <rect x="430" y="118" width="600" height="366" rx="22" fill="#ffffff" stroke="#ddd8e6" stroke-width="1.5"/>
  <text x="456" y="150" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b8697">NODE PROCESSES &#160;·&#160; NODE &gt;= 22.18</text>

  <!-- http-backend -->
  <rect x="458" y="170" width="544" height="136" rx="16" fill="#faf9fd" stroke="#ddd8e6" stroke-width="1.5"/>
  <circle cx="486" cy="202" r="6" fill="#7c3aed"/>
  <text x="504" y="208" font-size="16.5" font-weight="700" fill="#211f2b">http-backend</text>
  <text x="640" y="208" font-size="12.5" fill="#8b8697">:3005 · Express 4</text>
  <line x1="478" y1="226" x2="982" y2="226" stroke="#e8e4ef"/>
  <text x="480" y="248" font-size="12" fill="#514d5a">POST /signup · /signin</text>
  <text x="480" y="268" font-size="12" fill="#514d5a">POST /room · /room/:slug/join</text>
  <text x="740" y="248" font-size="12" fill="#514d5a">GET /rooms · /room/:slug</text>
  <text x="740" y="268" font-size="12" fill="#514d5a">GET /chats/:roomId</text>
  <text x="480" y="292" font-size="12" fill="#514d5a">DELETE /room/:slug</text>
  <text x="740" y="292" font-size="12" fill="#514d5a">bcrypt · JWT · rate limit</text>

  <!-- ws-backend -->
  <rect x="458" y="322" width="544" height="136" rx="16" fill="#faf9fd" stroke="#ddd8e6" stroke-width="1.5"/>
  <circle cx="486" cy="354" r="6" fill="#db2777"/>
  <text x="504" y="360" font-size="16.5" font-weight="700" fill="#211f2b">ws-backend</text>
  <text x="632" y="360" font-size="12.5" fill="#8b8697">:8089 · ws</text>
  <line x1="478" y1="378" x2="982" y2="378" stroke="#e8e4ef"/>
  <text x="480" y="400" font-size="12" fill="#514d5a">join_room · leave_room</text>
  <text x="480" y="420" font-size="12" fill="#514d5a">chat (drawing event)</text>
  <text x="740" y="400" font-size="12" fill="#514d5a">JWT via ?token= query</text>
  <text x="740" y="420" font-size="12" fill="#514d5a">membership re-checked</text>
  <text x="480" y="444" font-size="12" fill="#514d5a">30s ping / pong</text>
  <text x="740" y="444" font-size="12" fill="#514d5a">30s heartbeat reaping</text>

  <!-- ===================== DATABASE ===================== -->
  <rect x="1110" y="130" width="270" height="330" rx="20" fill="url(#dark)" filter="url(#shadow)"/>
  <text x="1245" y="174" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
  <text x="1245" y="197" font-size="12.5" fill="#b9b3c7" text-anchor="middle">Prisma 6.5 · Neon</text>
  <line x1="1140" y1="216" x2="1350" y2="216" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="1142" y="242" font-size="12.5" fill="#e9e5f2">User</text>
  <text x="1200" y="242" font-size="11.5" fill="#9d97ad">email · bcrypt hash</text>
  <text x="1142" y="274" font-size="12.5" fill="#e9e5f2">Room</text>
  <text x="1200" y="274" font-size="11.5" fill="#9d97ad">slug · adminId</text>
  <text x="1142" y="306" font-size="12.5" fill="#e9e5f2">RoomMember</text>
  <text x="1256" y="306" font-size="11.5" fill="#9d97ad">access control</text>
  <text x="1142" y="338" font-size="12.5" fill="#e9e5f2">Chat</text>
  <text x="1192" y="338" font-size="11.5" fill="#9d97ad">append-only event log</text>
  <line x1="1140" y1="360" x2="1350" y2="360" stroke="#ffffff" stroke-opacity="0.2"/>
  <text x="1142" y="386" font-size="11.5" fill="#b9b3c7">Cascade delete on</text>
  <text x="1142" y="406" font-size="11.5" fill="#b9b3c7">room removal</text>
  <text x="1142" y="432" font-size="11.5" fill="#f9a8d4">known limit: log grows</text>
  <text x="1142" y="452" font-size="11.5" fill="#f9a8d4">without bound</text>

  <!-- ===================== EDGES: client -> api ===================== -->
  <path d="M 330 232 C 380 232, 400 232, 452 238" fill="none" stroke="#8b8697" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="222" font-size="11.5" font-weight="600" fill="#514d5a" text-anchor="middle">HTTPS</text>
  <text x="384" y="248" font-size="10.5" fill="#8b8697" text-anchor="end">Bearer JWT</text>

  <!-- client -> ws (bidirectional) -->
  <path d="M 330 400 C 380 400, 400 398, 452 394" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 452 410 C 400 414, 380 418, 330 420" fill="none" stroke="#db2777" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="392" font-size="11.5" font-weight="600" fill="#9d174d" text-anchor="middle">WSS</text>
  <text x="384" y="438" font-size="10.5" fill="#be185d" text-anchor="end">live drawing events</text>

  <!-- api -> db -->
  <path d="M 1002 226 C 1050 226, 1060 232, 1104 250" fill="none" stroke="#8b8697" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- ws -> db -->
  <path d="M 1002 420 C 1050 420, 1060 396, 1104 370" fill="none" stroke="#8b8697" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===================== SHARED PACKAGES ===================== -->
  <rect x="60" y="520" width="1320" height="132" rx="20" fill="#ffffff" stroke="#ddd8e6" stroke-width="1.5"/>
  <text x="88" y="552" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b8697">SHARED PACKAGES &#160;·&#160; PRIVATE, COMPILED TO DIST/</text>

  <rect x="88" y="570" width="300" height="60" rx="12" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="106" y="596" font-size="14" font-weight="650" fill="#211f2b">@repo/common</text>
  <text x="106" y="616" font-size="11.5" fill="#777481">Zod schemas — client + server</text>

  <rect x="406" y="570" width="300" height="60" rx="12" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="424" y="596" font-size="14" font-weight="650" fill="#211f2b">@repo/backend-common</text>
  <text x="424" y="616" font-size="11.5" fill="#777481">env · bcrypt · JWT sign/verify</text>

  <rect x="724" y="570" width="300" height="60" rx="12" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="742" y="596" font-size="14" font-weight="650" fill="#211f2b">@repo/db</text>
  <text x="742" y="616" font-size="11.5" fill="#777481">Prisma client + migrations</text>

  <rect x="1042" y="570" width="300" height="60" rx="12" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="1060" y="596" font-size="14" font-weight="650" fill="#211f2b">@repo/eslint-config</text>
  <text x="1060" y="616" font-size="11.5" fill="#777481">base · node · next-js</text>

  <path d="M 730 484 L 730 566" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <path d="M 556 484 L 556 566" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>

  <!-- ===================== SECURITY ===================== -->
  <rect x="60" y="684" width="430" height="252" rx="20" fill="#ffffff" stroke="#ddd8e6" stroke-width="1.5"/>
  <text x="88" y="716" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b8697">SECURITY MODEL</text>

  <rect x="88" y="736" width="374" height="46" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="106" y="756" font-size="12.5" font-weight="600" fill="#065f46">bcrypt cost 12 · one-time plaintext upgrade</text>
  <text x="106" y="774" font-size="11" fill="#047857">legacy rows rehashed on first sign-in</text>

  <rect x="88" y="790" width="374" height="46" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="106" y="810" font-size="12.5" font-weight="600" fill="#065f46">JWT always expires · no default secret</text>
  <text x="106" y="828" font-size="11" fill="#047857">missing or short secret fails at startup</text>

  <rect x="88" y="844" width="374" height="46" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="106" y="864" font-size="12.5" font-weight="600" fill="#065f46">Reads require token + membership</text>
  <text x="106" y="882" font-size="11" fill="#047857">sequential ids cannot be guessed around</text>

  <rect x="88" y="898" width="374" height="30" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="106" y="918" font-size="12.5" font-weight="600" fill="#065f46">Delete requires ownership · 403 otherwise</text>

  <!-- ===================== STATUS CODES ===================== -->
  <rect x="510" y="684" width="430" height="252" rx="20" fill="#ffffff" stroke="#ddd8e6" stroke-width="1.5"/>
  <text x="538" y="716" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b8697">RESPONSE CODES</text>

  <rect x="538" y="736" width="74" height="34" rx="9" fill="#fee2e2"/>
  <text x="575" y="759" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">400</text>
  <text x="626" y="759" font-size="12.5" fill="#514d5a">invalid input (Zod)</text>

  <rect x="538" y="778" width="74" height="34" rx="9" fill="#ffedd5"/>
  <text x="575" y="801" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle">401</text>
  <text x="626" y="801" font-size="12.5" fill="#514d5a">missing / invalid / expired token</text>

  <rect x="538" y="820" width="74" height="34" rx="9" fill="#fef3c7"/>
  <text x="575" y="843" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">403</text>
  <text x="626" y="843" font-size="12.5" fill="#514d5a">authenticated, not the owner</text>

  <rect x="538" y="862" width="74" height="34" rx="9" fill="#fee2e2"/>
  <text x="575" y="885" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">404</text>
  <text x="626" y="885" font-size="12.5" fill="#514d5a">not found, or not a member</text>

  <rect x="538" y="904" width="74" height="24" rx="8" fill="#ede9fe"/>
  <text x="575" y="921" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">409</text>
  <text x="626" y="921" font-size="12.5" fill="#514d5a">name already taken</text>

  <!-- ===================== FLOW ===================== -->
  <rect x="960" y="684" width="420" height="252" rx="20" fill="#ffffff" stroke="#ddd8e6" stroke-width="1.5"/>
  <text x="988" y="716" font-size="12" font-weight="600" letter-spacing="1.4" fill="#8b8697">BOARD LOAD FLOW</text>

  <rect x="988" y="734" width="364" height="32" rx="9" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="1006" y="755" font-size="12.5" fill="#211f2b">token in localStorage?</text>
  <text x="1338" y="755" font-size="12.5" fill="#777481" text-anchor="end">no → /signin</text>

  <path d="M 1170 768 L 1170 782" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <rect x="988" y="784" width="364" height="32" rx="9" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="1006" y="805" font-size="12.5" fill="#211f2b">GET /room/:slug</text>
  <text x="1338" y="805" font-size="12.5" fill="#777481" text-anchor="end">404 → join</text>

  <path d="M 1170 818 L 1170 832" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <rect x="988" y="834" width="364" height="32" rx="9" fill="#f5f3fa" stroke="#e4e0ee"/>
  <text x="1006" y="855" font-size="12.5" fill="#211f2b">GET /chats/:roomId</text>
  <text x="1338" y="855" font-size="11.5" fill="#777481" text-anchor="end">membership checked</text>

  <path d="M 1170 868 L 1170 882" stroke="#c4b5fd" stroke-width="2" marker-end="url(#arrowAccent)"/>

  <rect x="988" y="884" width="364" height="32" rx="9" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="1006" y="905" font-size="12.5" font-weight="600" fill="#5b21b6">replay event log → Canvas mounts</text>

  <text x="60" y="972" font-size="11.5" fill="#8b8697">Interactive diagrams: docs/architecture.md</text>
</svg>